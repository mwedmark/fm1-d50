# The D-50 firmware built on GitHub (issue #36), by fm1-base's shared builder (zvenson/fm1-build: JieLi's toolchain, the AC79 SDK
# and a signed build attestation). A pull request or a push to main builds it as a check, the package kept as the run's artifact;
# a tag vX.Y builds the release X.Y and publishes it as that tag's GitHub release.
#
# The browser emulator (issue #40) is built beside it, and a push to main publishes it on GitHub Pages
# (https://mwedmark.github.io/fm1-d50/).
#
# No D-50 data is ever on GitHub (Roland's PCM ROM and the banks stay on the maintainer's computer). The runner builds without the
# resource region (fm1.toml's resources lines are left out), so the package and the emulator carry no Roland data. The firmware reads
# the region the FM-1 already holds (fm1base/app.c app_d50_data), so installing it keeps the data and plays it; the emulator takes
# your own data file in the browser (fm1base/web/emu/app.js). README.md: your own data.
#
# The platform: tools/ci/fetch_platform.sh (fm1-base's fork at d50-layout, felucca-bsp with tools/ci/felucca-bsp-d50-layout.patch).
name: firmware

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d50-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      build: |
        set -euo pipefail
        base="$RUNNER_TEMP/fm1-base"
        bash tools/ci/fetch_platform.sh "$base"
        # the fonts' OpenType features (fm1-base tools/gen_font.py): Pillow's raqm, which loads the system's FriBiDi
        sudo apt-get install -y -qq libfribidi0
        python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
        # PicoFaceD5's sample table (fm1.toml includes roms/gen) from its committed JSON, without the ROM
        python3 tools/ci/make_pcm_table.py roms/gen
        # no D-50 data: the build without the resource region
        sed -i '/^resources\(_what\)\? *=/d' fm1base/fm1.toml
        if grep -q '^resources' fm1base/fm1.toml; then echo 'fm1.toml still names resources'; exit 1; fi
        mkdir -p build/release-assets
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          version=${GITHUB_REF_NAME#v}
          python3 "$base/tools/build.py" fm1base --no-ble --release "$version"
          cp "fm1base/build/d50-$version.fwsc" build/release-assets/
          cp fm1base/build/d50.bin "build/release-assets/d50-$version-app.bin"
        else
          python3 "$base/tools/build.py" fm1base --no-ble
          cp fm1base/build/d50.fwsc build/release-assets/
          cp fm1base/build/d50.bin build/release-assets/d50-app.bin
        fi
        if ls fm1base/build/*-res.bin >/dev/null 2>&1; then echo 'a resource region was built'; exit 1; fi
        cp fm1base/build/firmware.json build/release-assets/
        ls -l build/release-assets
      packages: build/release-assets/*

  emulator:
    needs: firmware        # the install page (issue #45) takes this run's firmware package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'
      - name: Build the emulator
        run: |
          set -euo pipefail
          python3 -m pip install -q Pillow
          sudo apt-get install -y -qq libfribidi0
          # Emscripten, a fixed version from emsdk at a fixed commit (as fm1-base's template for its .rfm1)
          git clone -q https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout -q a2b92777574c2feda07994cd4f1079a3dfc151f8   # emsdk 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10 >/dev/null
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10 >/dev/null
          set +u; source "$RUNNER_TEMP/emsdk/emsdk_env.sh" >/dev/null; set -u
          base="$RUNNER_TEMP/fm1-base"
          bash tools/ci/fetch_platform.sh "$base"
          python3 tools/ci/make_pcm_table.py roms/gen
          sed -i '/^resources\(_what\)\? *=/d' fm1base/fm1.toml
          if grep -q '^resources' fm1base/fm1.toml; then echo 'fm1.toml still names resources'; exit 1; fi
          python3 "$base/tools/build.py" fm1base --no-ble --web
          rm -rf fm1base/build/emu/o2 fm1base/build/emu/web
          if find fm1base/build/emu -name '*.fmd5' -o -name '*.syx' | grep -q .; then echo 'D-50 data in the page'; exit 1; fi
          ls -l fm1base/build/emu
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: packages
          path: packages
      - name: The install page (issue #45)
        run: |
          set -euo pipefail
          # fm1-base's web installer with this run's firmware package (no D-50 data in it), at /install/ beside the emulator
          pkg=$(ls packages/build/release-assets/d50*.fwsc | head -1)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then version=${GITHUB_REF_NAME#v}; else version="main-${GITHUB_SHA::7}"; fi
          python3 tools/ci/make_install_page.py "$RUNNER_TEMP/fm1-base" fm1base "$pkg" "$version" fm1base/build/emu
          if find fm1base/build/emu -name '*-res.bin' -o -name '*.fmd5' -o -name '*.syx' | grep -q .; then echo 'D-50 data in the page'; exit 1; fi
          ls -l fm1base/build/emu/install fm1base/build/emu/firmware
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3.0.1
        with:
          path: fm1base/build/emu

  pages:
    needs: emulator
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4.0.5
