# The D-50 firmware built on GitHub (issue #36). A pull request or a push to main builds it as a check, the package kept as the run's
# artifact; a tag vX.Y builds the release X.Y and publishes it as that tag's GitHub release.
#
# The steps are fm1-base's shared builder's (zvenson/fm1-build v1: Python + Pillow, JieLi's Linux toolchain from JieLi's server, the AC79
# SDK at its fixed tag), without its build attestation: GitHub makes attestations only for public repositories, and this one is private.
# (Made public, the job can go back to `uses: zvenson/fm1-build/.github/workflows/build.yml@v1` with the same build command, and the
# Firmware Hub would show the packages as built from source.)
#
# No D-50 data is ever on GitHub (Roland's PCM ROM and the banks stay on the maintainer's computer). The runner builds without the
# resource region (fm1.toml's resources lines are left out), so the package carries no Roland data; such a build reads the region the
# FM-1 already holds (fm1base/app.c app_d50_data), so installing it keeps the data and plays it. README.md: installing your own data.
#
# The platform: fm1-base at the fork's d50-layout (fm1.toml data_lo), and felucca-bsp upstream with tools/ci/felucca-bsp-d50-layout.patch.
name: firmware

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d50-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # the release on a tag
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: JieLi Linux toolchain (pkgman.jieliapp.com)
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
          echo "toolchain: $(basename "$TC")"

      - name: JieLi AC79 SDK (gitee.com, a fixed tag)
        run: |
          for i in 1 2 3; do                     # (gitee.com drops a clone now and then: try again)
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: fm1-base and felucca-bsp
        run: |
          set -euo pipefail
          FM1_BASE_COMMIT=0615d335172a93be6393cd4637dd2a853def9509   # mwedmark/fm1-base d50-layout: fm1.toml data_lo
          BSP_COMMIT=2a5af3dfc8bccb92e37d48a3e7e0bf9a5827e51f        # hugelton/felucca-bsp, before tools/ci/felucca-bsp-d50-layout.patch
          base="$RUNNER_TEMP/fm1-base"
          git clone -q https://github.com/mwedmark/fm1-base.git "$base"
          git -C "$base" checkout -q "$FM1_BASE_COMMIT"
          rm -rf "$base/bsp"
          git clone -q https://github.com/hugelton/felucca-bsp.git "$base/bsp"
          git -C "$base/bsp" checkout -q "$BSP_COMMIT"
          git -C "$base/bsp" apply "$GITHUB_WORKSPACE/tools/ci/felucca-bsp-d50-layout.patch"
          echo "FM1_BASE=$base" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          # the fonts' OpenType features (fm1-base tools/gen_font.py): Pillow's raqm, which loads the system's FriBiDi
          sudo apt-get install -y -qq libfribidi0
          python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
          # PicoFaceD5's sample table (fm1.toml includes roms/gen) from its committed JSON, without the ROM
          python3 tools/ci/make_pcm_table.py roms/gen
          # no D-50 data: the build without the resource region
          sed -i '/^resources\(_what\)\? *=/d' fm1base/fm1.toml
          if grep -q '^resources' fm1base/fm1.toml; then echo 'fm1.toml still names resources'; exit 1; fi
          mkdir -p build/release-assets
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version=${GITHUB_REF_NAME#v}
            python3 "$FM1_BASE/tools/build.py" fm1base --no-ble --release "$version"
            cp "fm1base/build/d50-$version.fwsc" build/release-assets/
            cp fm1base/build/d50.bin "build/release-assets/d50-$version-app.bin"
          else
            python3 "$FM1_BASE/tools/build.py" fm1base --no-ble
            cp fm1base/build/d50.fwsc build/release-assets/
            cp fm1base/build/d50.bin build/release-assets/d50-app.bin
          fi
          if ls fm1base/build/*-res.bin >/dev/null 2>&1; then echo 'a resource region was built'; exit 1; fi
          cp fm1base/build/firmware.json build/release-assets/
          (cd build/release-assets && sha256sum * | tee SHA256SUMS)
          echo '### firmware' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; ls -l build/release-assets >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: firmware
          path: build/release-assets/
          if-no-files-found: error

      - name: Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8   # v2.3.2
        with:
          files: build/release-assets/*
          generate_release_notes: true
