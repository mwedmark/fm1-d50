<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF2 to FM-1</title>
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66;
    --line: #dcdcd5; --accent: #1f6feb; --accent-ink: #ffffff; --ok: #1a7f37; --warn: #9a6700;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --ink: #ecece6; --muted: #9a9a92;
      --line: #34342f; --accent: #5b9bff; --accent-ink: #0b1220; --ok: #56d364; --warn: #e3b341;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  #drop { display: block; text-align: center; padding: 36px 16px; border: 2px dashed var(--line);
          border-radius: 10px; cursor: pointer; background: var(--panel); margin-bottom: 16px; }
  #drop.over, #drop:focus-visible { border-color: var(--accent); outline: none; background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
  #drop strong { display: block; font-size: 16px; }
  #drop span { color: var(--muted); }
  #file { position: absolute; width: 1px; height: 1px; opacity: 0; }
  label.f { display: block; margin: 0 0 12px; }
  label.f > span { display: block; font-weight: 600; margin-bottom: 4px; }
  select, button { font: inherit; }
  select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
  button { padding: 9px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .meta { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .warn { color: var(--warn); }
  .ok { color: var(--ok); }
  [hidden] { display: none !important; }
  .tablewrap { max-height: 280px; overflow: auto; margin-top: 8px; }
  .pickbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .pickbar button { padding: 5px 10px; font-size: 14px; }
  .pickbar input { flex: 1 1 160px; min-width: 0; font: inherit; font-size: 14px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  .picklist { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 14px;
              display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); column-gap: 16px; align-content: start; }
  .picklist label { display: flex; gap: 6px; align-items: baseline; padding: 2px 0; cursor: pointer; min-width: 0; }
  .picklist label.off { color: var(--muted); cursor: default; }
  .picklist .num { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 4.5em; }
  .picklist h4 { grid-column: 1 / -1; margin: 6px 0 2px; font-size: 13px; color: var(--muted); }
  #pickSum { margin: 8px 0 12px; }
  .rules { display: grid; gap: 6px; margin-bottom: 8px; }
  .rule { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) minmax(0, 1.4fr) auto; gap: 6px; align-items: center; font-size: 14px; }
  .rule select, .rule input, #packSounds select { width: 100%; min-width: 0; font: inherit; font-size: 14px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  .rule .keysBox { display: flex; gap: 4px; min-width: 0; }
  .rule button { padding: 4px 10px; }
  @media (max-width: 520px) { .rule { grid-template-columns: 1fr auto; } .rule .keysBox, .rule .act { grid-column: 1 / 2; } }
  #packSounds td { vertical-align: top; }
  #packSounds tr.mine td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .keys { display: flex; flex-wrap: wrap; gap: 3px; margin: 8px 0; }
  .keys button { min-width: 38px; padding: 14px 4px 6px; font-size: 11px; background: var(--panel); color: var(--ink); border-radius: 4px; }
  .keys button.black { background: var(--ink); color: var(--bg); padding-top: 6px; }
  .keys button.down { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>SF2 to FM-1</h1>
  <p class="sub">Drop in a SoundFont. Everything happens in the browser; the file never leaves your computer.</p>

  <label id="drop" for="file" tabindex="0">
    <strong id="dropTitle">Drop an .sf2 file here</strong>
    <span>or click to choose one</span>
    <input id="file" type="file" accept=".sf2">
  </label>

  <section id="opts" class="panel" hidden>
    <p class="meta" id="info"></p>
    <label class="f"><span>Preset</span><select id="preset"></select></label>
    <div id="pick" hidden>
      <div class="pickbar">
        <button type="button" data-pick="all">All</button><button type="button" data-pick="none">None</button>
        <button type="button" data-pick="melodic">Melodic only</button><button type="button" data-pick="drums">Drums only</button>
        <button type="button" id="pickFill" title="Choose one or more MIDI files: tick the instruments and drum kits they play">Fill from MIDI files</button>
        <input type="file" id="pickMidi" accept=".mid,.midi,audio/midi" multiple hidden>
        <input id="pickFilter" type="search" placeholder="Filter by name or number" aria-label="Filter the instruments">
      </div>
      <div id="pickList" class="picklist" role="group" aria-label="Instruments to put in the bank"></div>
      <p class="meta" id="pickSum"></p>
      <p class="meta" id="pickMidiInfo" hidden></p>
    </div>
    <div class="row">
      <label class="f"><span>Encoding</span>
        <select id="codec">
          <option value="sea">SEA5 (5.7 bit/sample; simulator and download only: the FM-1 firmware does not play it)</option>
          <option value="sea6">SEA6 (6.7 bit/sample; simulator and download only)</option>
          <option value="bfp8" selected>BFP8 (8 bit with a scale per 32 samples, 8.25 bit/sample, easy to decode)</option>
          <option value="pcm">Raw PCM (simulator and download only)</option>
          <option value="lossless">Lossless, fewer bits where needed, for the live-cache firmware of 2026-11-17 or later (no MP3, no cache: every sound plays from flash)</option>
          <option value="mp3_64">MP3 64 kbit/s, packed for the live-cache firmware (BFP8 at 44,100 Hz underneath)</option>
          <option value="mp3_128">MP3 128 kbit/s, packed for the live-cache firmware</option>
          <option value="mp3_256">MP3 256 kbit/s, packed for the live-cache firmware</option>
        </select></label>
      <label class="f"><span>Sample rate</span>
        <select id="rateMode" title="Auto: the highest rate at which the bank still fits the FM-1's flash. Manual: the rate typed in the box.">
          <option value="auto" selected>Auto (as high as fits)</option>
          <option value="manual">Manual</option>
        </select>
        <input id="rateHz" type="number" min="4000" max="44118" step="1" value="32000" style="width:6em" aria-label="Sample rate in Hz (Manual)">
        <select id="rate" aria-label="Common sample rates (fills the box)">
          <option value="32000" selected>32,000 Hz (SEA)</option>
          <option value="16000">16,000 Hz</option>
          <option value="24000">24,000 Hz</option>
          <option value="11029">11,029 Hz (FM-1 ÷ 4)</option>
          <option value="14706">14,706 Hz (FM-1 ÷ 3)</option>
          <option value="22059">22,059 Hz (FM-1 ÷ 2)</option>
          <option value="44118">44,118 Hz (FM-1, full)</option>
          <option value="8000">8,000 Hz</option>
          <option value="11025">11,025 Hz</option>
          <option value="22050">22,050 Hz</option>
          <option value="44100">44,100 Hz</option>
        </select></label>
      <label class="f"><span>Bit depth</span>
        <select id="bits">
          <option value="8" selected>8 bit</option>
          <option value="12">12 bit</option>
          <option value="16">16 bit</option>
        </select></label>
    </div>
    <div id="mp3Pick" hidden>
      <label class="f"><span>Which sounds may be MP3</span>
        <select id="mp3Mode">
          <option value="all" selected>Any: MP3 where it sounds right, BFP8 where it does not (fits the most)</option>
          <option value="oneshot">Only sounds without a loop (drums, plucks): looped sounds stay lossless, so the cache holds only short sounds</option>
          <option value="chosen">Only what the rules below allow (with no such rule none: every sound lossless, fewer bits or a lower rate where the flash needs it, no cache)</option>
        </select></label>
      <div id="rules" class="rules" aria-label="Rules for single instruments and drum sounds"></div>
      <div class="pickbar">
        <button type="button" data-rule="hats">+ Hi-hats and cymbals may be MP3</button>
        <button type="button" data-rule="drums">+ All drums may be MP3</button>
        <button type="button" data-rule="keep">+ Keep an instrument untouched</button>
        <button type="button" data-rule="blank">+ Rule</button>
      </div>
      <p class="meta" id="rulesInfo"></p>
    </div>
    <div class="actions"><button id="go" class="primary">Convert</button></div>
  </section>

  <section id="result" class="panel" hidden>
    <p class="meta" id="summary"></p>
    <div class="actions">
      <button id="dlSf2">Download .sf2</button>
      <button id="dlBin">Download .bin</button>
      <button id="dlFlash" title="The bank as the fm1-emu emulator's flash file: open emu/index.html?flash=<file> with the firmware's .fwsc">Download .flash (emulator)</button>
      <button id="sendFm1" title="Writes the bank to the FM-1's flash over MIDI (SF2 player firmware, Chrome/Edge with Web MIDI)">Send to FM-1</button>
      <select id="midiOut" aria-label="MIDI output to the FM-1" hidden></select>
    </div>
    <p class="meta" id="sendStatus" hidden></p>
    <div id="packView" hidden>
      <p class="meta" id="packHelp"></p>
      <div class="pickbar"><input id="packFilter" type="search" placeholder="Filter by instrument, drum sound or what it became" aria-label="Filter the sounds"></div>
      <div class="tablewrap">
        <table>
          <thead><tr><th class="n">#</th><th>Played by</th><th class="n">Length</th><th>Became</th><th>Choice</th></tr></thead>
          <tbody id="packSounds"></tbody>
        </table>
      </div>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Sound</th><th class="n">Notes</th><th class="n">Root</th><th>Loop</th><th class="n">Bytes</th></tr></thead>
        <tbody id="zones"></tbody>
      </table>
    </div>
  </section>
  <section id="play" class="panel" hidden>
    <label class="f"><span>Try it in the FM-1 simulator</span><select id="program"></select></label>
    <div id="keys" class="keys" role="group" aria-label="Piano keys"></div>
    <p class="meta" id="playHelp">Click the keys or play with the computer keyboard: a w s e d f t g y h u j k. Octave down/up: z / x.</p>
  </section>
  <p id="err" class="warn" role="alert" hidden></p>
</main>
<script src="simulator_wasm.js" onerror="void 0"></script>
<!-- MP3 banks: LAME in JavaScript (LGPL-3.0, third_party/lamejs), the firmware's decoder and the packer pack_bank.js -->
<script src="third_party/lamejs/lame.min.js" onerror="void 0"></script>
<script src="mp3_decoder_wasm.js" onerror="void 0"></script>
<script src="pack_bank.js" onerror="void 0"></script>

<script id="core">
// ---- SF2 reader -----------------------------------------------------------

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const noteName = n => NOTE_NAMES[n % 12] + (Math.floor(n / 12) - 1);

function parseSf2(buf) {
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  const str = (o, n) => { let s = ''; for (let i = 0; i < n; i++) { const c = u8[o + i]; if (!c) break; s += String.fromCharCode(c); } return s; };
  if (buf.byteLength < 12 || str(0, 4) !== 'RIFF' || str(8, 4) !== 'sfbk') throw new Error('This is not an SF2 file (no RIFF/sfbk).');

  const chunks = {};
  let smplOff = 0, smplLen = 0;
  const end = Math.min(buf.byteLength, 8 + dv.getUint32(4, true));
  for (let pos = 12; pos + 8 <= end;) {
    const id = str(pos, 4), size = dv.getUint32(pos + 4, true);
    if (id === 'LIST') {
      const stop = Math.min(pos + 8 + size, buf.byteLength);
      for (let p = pos + 12; p + 8 <= stop;) {
        const cid = str(p, 4), cs = dv.getUint32(p + 4, true);
        if (cid === 'smpl') { smplOff = p + 8; smplLen = cs; } else chunks[cid] = { off: p + 8, size: cs };
        p += 8 + cs + (cs & 1);
      }
    }
    pos += 8 + size + (size & 1);
  }
  for (const k of ['phdr', 'pbag', 'pgen', 'inst', 'ibag', 'igen', 'shdr'])
    if (!chunks[k]) throw new Error('The SF2 file has no ' + k + ' chunk.');
  if (!smplLen) throw new Error('The SF2 file has no 16-bit sample data (smpl).');

  const recs = (name, size, fn) => {
    const c = chunks[name], out = [];
    for (let i = 0; i + size <= c.size; i += size) out.push(fn(c.off + i));
    return out;
  };
  const sf = {
    buf, dv, smplOff, smplLen,
    phdr: recs('phdr', 38, o => ({ name: str(o, 20), preset: dv.getUint16(o + 20, true), bank: dv.getUint16(o + 22, true), bag: dv.getUint16(o + 24, true) })),
    pbag: recs('pbag', 4, o => ({ gen: dv.getUint16(o, true) })),
    pgen: recs('pgen', 4, o => ({ op: dv.getUint16(o, true), lo: u8[o + 2], hi: u8[o + 3], s: dv.getInt16(o + 2, true), u: dv.getUint16(o + 2, true) })),
    inst: recs('inst', 22, o => ({ name: str(o, 20), bag: dv.getUint16(o + 20, true) })),
    ibag: recs('ibag', 4, o => ({ gen: dv.getUint16(o, true) })),
    igen: recs('igen', 4, o => ({ op: dv.getUint16(o, true), lo: u8[o + 2], hi: u8[o + 3], s: dv.getInt16(o + 2, true), u: dv.getUint16(o + 2, true) })),
    shdr: recs('shdr', 46, o => ({
      name: str(o, 20), start: dv.getUint32(o + 20, true), end: dv.getUint32(o + 24, true),
      startLoop: dv.getUint32(o + 28, true), endLoop: dv.getUint32(o + 32, true),
      rate: dv.getUint32(o + 36, true), pitch: u8[o + 40], correction: dv.getInt8(o + 41),
      link: dv.getUint16(o + 42, true), type: dv.getUint16(o + 44, true)
    })),
  };
  sf.presets = sf.phdr.slice(0, -1);   // last record is the EOP terminator
  return sf;
}

function genMap(sf, kind, bagIdx) {
  const bag = sf[kind + 'bag'], gen = sf[kind + 'gen'], m = {};
  for (let g = bag[bagIdx].gen; g < bag[bagIdx + 1].gen; g++) m[gen[g].op] = gen[g];
  return m;
}

// One entry per playable key range of a preset: {lo, hi, sample, root, loop, loopOffStart, loopOffEnd}
function presetZones(sf, p) {
  const ph = sf.phdr[p], next = sf.phdr[p + 1];
  const zones = [];
  let pGlobal = null;
  for (let b = ph.bag; b < next.bag; b++) {
    const pm = genMap(sf, 'p', b);
    if (pm[41] === undefined) { if (b === ph.bag) pGlobal = pm; continue; }
    const pr = pm[43] || (pGlobal && pGlobal[43]);
    const plo = pr ? pr.lo : 0, phi = pr ? pr.hi : 127;
    const ii = sf.inst[pm[41].u], iNext = sf.inst[pm[41].u + 1];
    if (!ii || !iNext) continue;
    let iGlobal = null;
    for (let ib = ii.bag; ib < iNext.bag; ib++) {
      const im = genMap(sf, 'i', ib);
      if (im[53] === undefined) { if (ib === ii.bag) iGlobal = im; continue; }
      const g = k => im[k] || (iGlobal && iGlobal[k]);
      const kr = g(43);
      const lo = Math.max(kr ? kr.lo : 0, plo), hi = Math.min(kr ? kr.hi : 127, phi);
      if (lo > hi) continue;
      const vr = g(44);
      const sample = im[53].u;
      const sh = sf.shdr[sample];
      if (!sh || sh.type === 2) continue;            // right channel of a stereo pair: the left one is used as mono
      const rk = g(58), mode = g(54);
      const pg = k => pm[k] || (pGlobal && pGlobal[k]);
      const n = k => { const v = g(k); return v ? v.s : 0; };
      const np = k => { const v = pg(k); return v ? v.s : 0; };
      const tc = (k, dflt) => (g(k) ? g(k).s : dflt) + np(k);       // timecents: instrument value plus preset value
      zones.push({
        lo, hi, sample,
        cents: n(51) * 100 + n(52) + np(51) * 100 + np(52) + sh.correction,   // coarse + fine tune + the sample's own correction
        env: { attack: tc(34, -12000), hold: tc(35, -12000), decay: tc(36, -12000), sustain: n(37) + np(37), release: tc(38, -12000) },
        vlo: vr ? vr.lo : 0, vhi: vr ? vr.hi : 127,
        root: rk && rk.s >= 0 && rk.s <= 127 ? rk.s : (sh.pitch <= 127 ? sh.pitch : 60),
        loop: !!mode && (mode.u & 3) !== 0 && (mode.u & 3) !== 2,
        loopOffStart: n(2) + n(45) * 32768,
        loopOffEnd: n(3) + n(50) * 32768,
        // pan in 0.1 % (-500 left .. 500 right): instrument plus preset. The left half of a stereo pair plays as mono, centred.
        pan: sh.type === 4 ? 0 : Math.max(-500, Math.min(500, n(17) + np(17))),
        // initial attenuation in cB (instrument plus preset), scale tuning in cents per key (100 unless set; the preset's adds),
        // exclusive class (instrument level only, as the SF2 spec says: a note of the class cuts the others, e.g. hi-hats)
        atten: Math.max(0, Math.min(1440, n(48) + np(48))),
        scale: Math.max(0, Math.min(1200, (g(56) ? g(56).s : 100) + np(56))),
        excl: g(57) ? g(57).u & 127 : 0,
        // reverb and chorus send in 0.1 % (generators 16 and 15, instrument plus preset)
        reverb: Math.max(0, Math.min(1000, n(16) + np(16))),
        chorus: Math.max(0, Math.min(1000, n(15) + np(15))),
        // the LFOs (SF2 units: cB, cents, timecents; instrument plus preset), the key number's hold and decay scaling, the low-pass
        // filter (cutoff in absolute cents, resonance in cB) and the modulation envelope that moves its cutoff and the pitch
        mod: modRecord({
          lfoVolume: n(13) + np(13), lfoPitch: n(5) + np(5), vibPitch: n(6) + np(6),
          lfoDelay: tc(21, -12000), lfoFreq: tc(22, 0), vibDelay: tc(23, -12000), vibFreq: tc(24, 0),
          keyHold: n(39) + np(39), keyDecay: n(40) + np(40),
          filterFc: tc(8, 13500), filterQ: n(9) + np(9), envFc: n(11) + np(11), lfoFc: n(10) + np(10),
          envDelay: tc(25, -12000), envAttack: tc(26, -12000), envHold: tc(27, -12000), envDecay: tc(28, -12000),
          envSustain: n(29) + np(29), envRelease: tc(30, -12000), envPitch: n(7) + np(7),
        }),
      });
    }
  }
  // Several velocity layers would stack on the same keys: keep the layers that answer to velocity 100.
  const hit = zones.filter(z => z.vlo <= 100 && z.vhi >= 100);
  const kept = hit.length ? hit : zones;
  kept.sort((a, b) => a.lo - b.lo || a.hi - b.hi);
  return kept;
}

// Every sample in the file as one zone spanning the whole keyboard, like the original convert.py.
// A sample loops only when some instrument zone uses it with a loop mode.
function allSampleZones(sf) {
  const looped = new Set();
  for (let i = 0; i < sf.inst.length - 1; i++) {
    let glob = null;
    for (let b = sf.inst[i].bag; b < sf.inst[i + 1].bag; b++) {
      const m = genMap(sf, 'i', b);
      if (m[53] === undefined) { if (b === sf.inst[i].bag) glob = m; continue; }
      const mode = m[54] || (glob && glob[54]);
      if (mode && ((mode.u & 3) === 1 || (mode.u & 3) === 3)) looped.add(m[53].u);
    }
  }
  const zones = [];
  for (let i = 0; i < sf.shdr.length - 1; i++) {   // last record is EOS
    const sh = sf.shdr[i];
    if (sh.type === 2 || sh.end - sh.start < 2) continue;
    zones.push({ lo: 0, hi: 127, sample: i, root: sh.pitch <= 127 ? sh.pitch : 60, loop: looped.has(i), loopOffStart: 0, loopOffEnd: 0 });
  }
  return zones;
}

// ---- Choosing what fits ----------------------------------------------------

const MP3_BUDGET_KB = 400;   // the MP3 sounds decoded: at most this much (the firmware's cache pool is about 137 KB); the largest are then played at half the rate (pack_bank.js, --budget-kb)
const MP3_FILL = 1.9;     // an MP3 bank holds about this many times its flash in BFP8 sounds
// About how many bytes the sounds of the presets `list` take at `rate` and `perSample` bytes a sample (shared sounds counted once; loops and tables left out).
function estimateSoundBytes(sf, list, rate, perSample) {
  const seen = new Set(); let bytes = 0;
  for (const i of list) for (const z of presetZones(sf, i)) {
    if (seen.has(z.sample)) continue; seen.add(z.sample);
    const sh = sf.shdr[z.sample]; bytes += Math.max(0, sh.end - sh.start) * rate / (sh.rate > 0 ? sh.rate : 44100) * perSample;
  }
  return bytes;
}
// Which General MIDI instruments and drum kits a Standard MIDI File plays: { melodic: Map program -> notes, kits: Map program -> notes }. The events of
// all tracks are put in time order first, so a program change in one track is in force for the notes of another. Channel 10 plays a kit, chosen by its
// program change (bank select does not matter there, as in the firmware); on other channels the bank select 120 (or 1 with 0) before a program change
// makes it a kit, as transfer.c reads it. A channel that never changed program plays program 0.
function midiUsage(bytes) {
  const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes), dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);

  }
  const filterPack = () => { const q = $('packFilter').value.trim().toLowerCase(); for (const tr of $('packSounds').children) tr.hidden = !!q && !tr.dataset.find.includes(q); };
  $('packFilter').addEventListener('input', filterPack);

  let converting = false;
  async function convert() {
    if (converting) return;
    showErr('');
    const kbit = mp3Kbit(), tag = packTag();             // lossless packing measures the sounds through MP3 too (it then chooses no MP3): the same libraries
    if (tag && (typeof lamejs === 'undefined' || typeof MP3_DECODER === 'undefined' || typeof FM1_PACK === 'undefined')) { showErr('MP3 needs third_party/lamejs/lame.min.js, mp3_decoder_wasm.js and pack_bank.js next to this page.'); return; }
    const picking = $('preset').value === 'pick', list = picking ? chosen() : null;
    if (picking && !list.length) { $('result').hidden = true; showErr('Tick at least one instrument.'); return; }
    try {
      const sel = picking ? list : +$('preset').value;
      if (isAuto()) {
        // Auto: start at the estimate and build the real bank; while the file is too large, lower the rate by the share it is over
        let rate = autoGuess(picking ? list : sel < 0 ? sf.presets.map((p, i) => i) : [sel]);
        for (let n = 0; ; n++) {
          bank = buildBank(sf, sel, bankOptions(rate));
          const size = writeFm1(bank, bankInfo(bankFileName(0))).length;
          if (size <= FM1_SAMPLE_BANK || n >= 8) break;
          const next = Math.min(rate - 1, Math.floor(rate * FM1_SAMPLE_BANK / size * 0.995));
          if (next < RATE_MIN) { if (rate === RATE_MIN) break; rate = RATE_MIN; } else rate = next;
        }
        $('rateHz').value = bank.rate;
      } else {
        const rate = manualRate();
        if (!packing() && !(rate >= RATE_MIN && rate <= RATE_MAX)) { showErr('The sample rate must be between ' + RATE_MIN + ' and ' + RATE_MAX + ' Hz.'); return; }
        bank = buildBank(sf, sel, bankOptions(rate));
      }
    } catch (e) { showErr('The conversion failed: ' + e.message); return; }
    if (!bank.zones.length) { $('result').hidden = true; showErr('The preset has no playable sounds.'); return; }
    if (picking) {                                           // the font's instruments not ticked: silent at their program numbers
      const kept = new Set(bank.presets.map(slotOf));
      bank.emptySlots = [...new Set(sf.presets.map(slotOf).filter(s => s >= 0 && !kept.has(s)))];
    }
    bank.info = bankInfo(bankFileName(tag));                 // one name and time a conversion: the file sent and the one saved are the same
    const bin = writeFm1(bank, bank.info);
    let play = bin;
    if (tag) {
      converting = true; $('go').disabled = true; $('go').textContent = kbit ? 'Packing as MP3 ...' : 'Packing ...';
      await new Promise(r => setTimeout(r, 30));             // let the button show it: the packing takes a few seconds
      // the sounds' own choices are for the sounds they were made on: the bank's distinct zone samples (the packer numbers them by offset)
      const bdv = new DataView(bin.buffer, bin.byteOffset), zt = bdv.getUint32(32, true), sig = [...new Set(Array.from({ length: bdv.getUint16(14, true) }, (_, i) => bdv.getUint32(zt + i * 24, true) + '/' + bdv.getUint32(zt + i * 24 + 4, true)))].join();
      let dropped = 0;
      if (sig !== soundSig) { dropped = soundChoice.size; soundChoice.clear(); soundSig = sig; }
      try { bank.packed = FM1_PACK.pack(bin, { kbit: kbit || 64, fill: 1, 'budget-kb': MP3_BUDGET_KB, ...packChoice(), encode: lameEncode, decode: MP3_DECODER.decode }); bank.packed.tag = tag; }
      catch (e) { bank = null; $('result').hidden = true; $('packView').hidden = true; showErr('The packing failed: ' + e.message.replace(/^--(mp3-only|keep) /, '') + (/no sound is picked/.test(e.message) ? ' (a rule names an instrument or keys with no sound in this bank)' : '')); return; }
      finally { converting = false; $('go').disabled = false; $('go').textContent = 'Convert'; }
      if (dropped) { rulesInfo(); $('rulesInfo').insertAdjacentHTML('beforeend', ' <span class="warn">The instruments changed, so the ' + dropped + ' choices of single sounds were dropped.</span>'); }
      // the simulator plays plain banks: the BFP8 bank with each MP3 sound as the firmware decodes it
      play = bin.slice();
      for (const h of bank.packed.heard) play.set(packBfp8(h.pcm), h.off);
    }
    const p = bank.packed, file = p ? p.bytes : bin;
    $('summary').innerHTML = (bank.presets.length ? bank.presets.length + ' presets, ' : '') + (bank.zonesWritten ?? bank.zones.length) + ' zones, ' + (bank.soundsWritten ?? bank.samples.length) + ' unique sounds, ' + bank.rate + ' Hz, ' + (p ? (p.tag === 'lossless' ? 'lossless, packed' : 'MP3 ' + p.kbit + ' kbit/s') : bank.sea ? 'SEA' + bank.seaBits : bank.bfp ? 'BFP8' : bank.bits + ' bit') +
      (p ? ' (' + (p.tag === 'lossless' ? '' : (p.sounds - p.lossless) + ' sounds as MP3, mean ' + p.meanSnr.toFixed(1) + ' dB against the BFP8; ') + p.lossless + ' kept lossless' + (p.narrowed ? ' (' + p.narrowed + ' of them with fewer than 8 mantissa bits)' : '') + (p.halved ? '; ' + p.halved + ' halvings of the rate (their treble is cut) so that the flash or the cache of the firmware can hold them' : '') + (p.dropped ? '; ' + p.dropped + ' sounds left out (their zones play a neighbour\'s sound)' : '') + '; the BFP8 bank would be ' + fmtBytes(p.unpackedBytes) + ')' : '') +
      '. <strong>' + (p ? '.fm1b ' : '.bin ') + fmtBytes(file.length) + '</strong>' +
      (file.length > FM1_SAMPLE_BANK ? ' <span class="warn">(more than the device\'s sample bank of ' + fmtBytes(FM1_SAMPLE_BANK) + ')</span>' : ' (fits in the device\'s sample bank of ' + fmtBytes(FM1_SAMPLE_BANK) + ')') +
      (p ? '. <strong>It plays only on the live-cache firmware</strong> (<a href="install.html?firmware=live">the install page</a> installs it)' +
        (p.narrowed ? ', <strong>of 2026-11-17 or later</strong>: its sounds with fewer than 8 bits (codec 4) are refused by older firmware, which then plays nothing from the bank' : '') + '; the simulator below plays the sounds as that firmware decodes them (MP3, fewer bits, half rate)' : '') +
      (bank.emptySlots && bank.emptySlots.length ? '. ' + (bank.emptySlots.length === 1 ? 'The instrument not ticked is silent at its program number' : 'The ' + bank.emptySlots.length + ' instruments not ticked are silent at their program numbers') : '') +
      (bank.dropped ? ' <span class="warn">(' + bank.dropped + ' presets outside bank 0/128 are not in the .bin)</span>' : '');
    const tb = $('zones'); tb.textContent = '';
    for (const z of bank.zones) {
      const tr = document.createElement('tr');
      [z.presetName ? z.presetName + ': ' + z.sample.name : z.sample.name, noteName(z.lo) + ' – ' + noteName(z.hi), noteName(z.root), z.loop ? 'yes' : 'no', z.sample.bytes.toLocaleString('en-US')]
        .forEach((t, i) => { const td = document.createElement('td'); td.textContent = t; if (i === 4) td.className = 'n'; tr.appendChild(td); });
      tb.appendChild(tr);
    }
    $('result').hidden = false;
    drawPackView();
    Play.load(play);
  }
  // pcm (Int16Array, 32 kHz mono) to one constant-bit-rate MP3 stream: lamejs codes without the bit reservoir and writes no tag
  function lameEncode(pcm, kbit, rate = 44100) {
    const enc = new lamejs.Mp3Encoder(1, rate, kbit), parts = [];
    for (let i = 0; i < pcm.length; i += 1152) parts.push(enc.encodeBuffer(pcm.subarray(i, i + 1152)));
    parts.push(enc.flush());
    const out = new Uint8Array(parts.reduce((a, q) => a + q.length, 0));
    let at = 0;
    for (const q of parts) { out.set(new Uint8Array(q.buffer, q.byteOffset, q.length), at); at += q.length; }
    return out;
  }

  // ---- Playing the bank in the FM-1 simulator (fm1_open compiled to WebAssembly) ----
  const Play = (() => {
    let c = null, ctx = null, loaded = false, base = 48;
    const held = new Set();
    const KEYMAP = 'awsedftgyhujk';
    const has = typeof FM1_WASM_B64 !== 'undefined';

    async function start() {
      if (!c) {
        const raw = Uint8Array.from(atob(FM1_WASM_B64), ch => ch.charCodeAt(0));
        c = (await WebAssembly.instantiate(raw, {})).instance.exports;
        c._initialize(); c.sim_boot(1);
        if (c.sim_select(0, 5) !== 0) throw new Error('The simulator could not select the sampler track.');
      }
      if (!ctx) {
        ctx = new AudioContext({ sampleRate: 44100 });
        const node = ctx.createScriptProcessor(2048, 0, 2), frames = c.sim_block_frames();
        node.onaudioprocess = e => {
          const l = e.outputBuffer.getChannelData(0), r = e.outputBuffer.getChannelData(1);
          for (let at = 0; at < l.length; at += frames) {
            const f = new Float32Array(c.memory.buffer, c.sim_render(), frames * 2);
            for (let k = 0; k < frames && at + k < l.length; k++) { l[at + k] = f[k * 2]; r[at + k] = f[k * 2 + 1]; }
          }
        };
        node.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') await ctx.resume();
    }
    function midi(status, note, velocity) {
      new Uint8Array(c.memory.buffer, c.sim_file(), 3).set([status, note, velocity]);
      c.sim_midi(3);
    }
    function programs(bin) {
      const dv = new DataView(bin.buffer, bin.byteOffset, bin.length);
      const bankMap = dv.getUint32(20, true), presets = dv.getUint32(24, true), out = [];
      for (let slot = 0; slot < 256; slot++) {
        const p = dv.getUint16(bankMap + slot * 2, true);
        if (p === 0xffff || !dv.getUint16(presets + p * 24 + 2, true)) continue;   // no preset, or the empty one
        let name = ''; for (let i = 0; i < 20 && bin[presets + p * 24 + 4 + i]; i++) name += String.fromCharCode(bin[presets + p * 24 + 4 + i]);
        out.push({ slot, label: (slot < 128 ? 'Bank 0 / ' : 'Drums ') + String(slot % 128).padStart(3, '0') + '  ' + name.trim() });
      }
      return out;
    }
    async function load(bin) {
      $('play').hidden = true; loaded = false;
      if (!has) return;
      try {
        await start();
        // the simulator takes a bank of any size (older builds: up to 1 MB), so a bank too large for the FM-1 can still be heard
        const at = c.sim_melodic_reserve ? c.sim_melodic_reserve(bin.length) : bin.length <= c.sim_melodic_capacity() ? c.sim_melodic_buffer() : 0;
        if (!at) throw new Error('The bank is too large for the simulator.');
        new Uint8Array(c.memory.buffer, at, bin.length).set(bin);
        if (c.sim_melodic_load(bin.length) !== 0) throw new Error('The simulator rejected the bank.');
        const sel = $('program'); sel.textContent = '';
        for (const p of programs(bin)) { const o = document.createElement('option'); o.value = p.slot; o.textContent = p.label; sel.appendChild(o); }
        select();
        loaded = true; $('play').hidden = false; drawKeys();
      } catch (e) { showErr('Simulator: ' + e.message); }
    }
    function select() {
      const slot = +$('program').value;
      c.sim_melodic_program(slot < 128 ? 0 : 128, slot % 128);
    }
    function on(n) { if (!loaded || held.has(n)) return; held.add(n); midi(0x90, n, 100); mark(n, true); }
    function off(n) { if (!held.delete(n)) return; midi(0x90, n, 0); mark(n, false); }
    function mark(n, down) { const b = document.querySelector('#keys [data-note="' + n + '"]'); if (b) b.classList.toggle('down', down); }
    function drawKeys() {
      const box = $('keys'); box.textContent = '';
      for (let n = base; n < base + 25; n++) {
        const b = document.createElement('button');
        b.dataset.note = n; b.textContent = noteName(n);
        if ([1, 3, 6, 8, 10].includes(n % 12)) b.className = 'black';
        box.appendChild(b);
      }
    }
    $('program').addEventListener('change', () => loaded && select());
    const press = e => { const b = e.target.closest('[data-note]'); if (b) { e.preventDefault(); start().then(() => on(+b.dataset.note)); } };
    const lift = e => { const b = e.target.closest && e.target.closest('[data-note]'); if (b) off(+b.dataset.note); };
    $('keys').addEventListener('pointerdown', press);
    $('keys').addEventListener('pointerup', lift);
    $('keys').addEventListener('pointerleave', e => lift(e), true);
    window.addEventListener('keydown', e => {
      if (!loaded || e.repeat || e.ctrlKey || e.metaKey || e.altKey || /^(SELECT|INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
      if (e.key === 'z' || e.key === 'x') { for (const n of [...held]) off(n); base = Math.max(0, Math.min(96, base + (e.key === 'z' ? -12 : 12))); drawKeys(); return; }
      const i = KEYMAP.indexOf(e.key.toLowerCase());
      if (i >= 0) start().then(() => on(base + i));
    });
    window.addEventListener('keyup', e => { const i = KEYMAP.indexOf(e.key.toLowerCase()); if (i >= 0) off(base + i); });
    return { load };
  })();

  function download(bytes, name, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes], { type }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  const drop = $('drop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
  $('file').addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
  // dropping anywhere else on the page must not make the browser open the file
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  $('go').addEventListener('click', convert);
  const syncCodec = () => {                                  // SEA is always coded from 16 bit; MP3 is packed from BFP8 at 44.1 kHz
    $('bits').disabled = $('codec').value !== 'pcm';
    $('rateMode').disabled = $('rate').disabled = packing();     // an MP3 bank is made at 44,100 Hz whatever the menu says: show the nearest
    $('rateHz').disabled = packing() || isAuto();
    if (packing()) { $('rate').value = '44118'; $('rateHz').value = '44118'; }
  };
  $('codec').addEventListener('change', syncCodec);
  $('rateMode').addEventListener('change', syncCodec);
  $('rate').addEventListener('change', () => { $('rateHz').value = $('rate').value; $('rateMode').value = 'manual'; syncCodec(); });
  syncCodec();
  $('dlBin').addEventListener('click', () => bank && download(bankBytes(), bankFileName(), 'application/octet-stream'));
  // The bank as the fm1-emu emulator's flash file (emu/index.html?flash=...), as make_flash_overlay.js writes it: per 4096-byte sector a little-endian u32
  // flash offset and the sector, the bank at the start of the user partition (0x7C000), the last sector padded with 0xFF.
  function flashOverlay(b, start = 0x7C000) {
    const S = 4096, n = Math.ceil(b.length / S), out = new Uint8Array(n * (4 + S)).fill(0xff), dv = new DataView(out.buffer);
    for (let i = 0; i < n; i++) { dv.setUint32(i * (4 + S), start + i * S, true); out.set(b.subarray(i * S, Math.min(b.length, (i + 1) * S)), i * (4 + S) + 4); }
    return out;
  }
  $('dlFlash').addEventListener('click', () => bank && download(flashOverlay(bankBytes()), bankFileName().replace(/\.(fm1b|bin)$/, '') + '.flash', 'application/octet-stream'));
  // ---- Send the bank to the FM-1 (the SF2 player firmware receives it as SysEx and writes it to flash) ----
  const send = { access: null, busy: false };
  function sendMsg(text, bad) { const el = $('sendStatus'); el.hidden = !text; el.textContent = text || ''; el.className = bad ? 'meta warn' : 'meta'; }
  function midiPorts() {
    const out = $('midiOut'), cur = out.value;
    out.textContent = '';
    for (const o of send.access.outputs.values()) out.add(new Option(o.name, o.id));
    out.hidden = out.options.length === 0;
    const fm = [...out.options].find(o => /fm-?1/i.test(o.text));
    out.value = [...out.options].some(o => o.value === cur) ? cur : fm ? fm.value : out.value;
    return out.options.length;
  }
  // One frame out, its answer in (F0 7D 'S' 'F' 02 cmd|0x40 status F7): the firmware answers when the flash is written.
  function exchange(output, input, frame, ms) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { input.removeEventListener('midimessage', on); reject(new Error('timeout')); }, ms);
      function on(e) {
        const d = e.data;
        if (d.length === 8 && d[0] === 0xf0 && d[1] === 0x7d && d[2] === 0x53 && d[3] === 0x46 && d[4] === 2 && d[5] === (frame[5] | 0x40)) {
          clearTimeout(timer); input.removeEventListener('midimessage', on); resolve(d[6]);
        }
      }
      input.addEventListener('midimessage', on);
      output.send(frame);
    });
  }
  const SEND_ERRORS = { 1: 'malformed frame', 2: 'outside the flash', 3: 'flash error', 4: 'checksum mismatch', 5: 'no transfer in progress' };
  async function sendBank() {
    if (send.busy || !bank) return;
    let portsOpen = null;
    const bin = bankBytes();
    if (!bank.packed && !bank.bfp) { sendMsg('The FM-1 firmware plays only BFP8 and MP3 banks. Convert again with BFP8 or MP3; nothing was sent or erased.', true); return; }
    if (bin.length > FM1_SAMPLE_BANK) { sendMsg('The bank (' + fmtBytes(bin.length) + ') is larger than the flash (' + fmtBytes(FM1_SAMPLE_BANK) + ').', true); return; }
    if (!navigator.requestMIDIAccess) { sendMsg('This browser has no Web MIDI. Use Chrome or Edge.', true); return; }
    try {
      if (!send.access) send.access = await navigator.requestMIDIAccess({ sysex: true });
      if (!midiPorts()) { sendMsg('No MIDI output found. Connect the FM-1 over USB and try again.', true); return; }
      send.busy = true; $('sendFm1').disabled = true;
      sendMsg('Looking for the FM-1 ...');
      // Windows often names the USB port generically ("USB Audio Device"), so the name decides nothing: every output (the one chosen
      // first) is asked the bank-check question (cmd 9), which only the SF2 player answers (status 0 same bank, 4 another, 1 older firmware).
      const wanted = send.access.outputs.get($('midiOut').value);
      const outs = [wanted, ...[...send.access.outputs.values()].filter(o => o !== wanted && o.state === 'connected')].filter(Boolean);
      const ins = [...send.access.inputs.values()].filter(i => i.state === 'connected');
      const ask = [0xf0, 0x7d, 0x53, 0x46, 2, 9, ...num35(bin.length), ...num35(crc32(bin)), 0xf7];
      let output = null, input = null;
      search: for (const o of outs) {
        const same = ins.filter(i => i.name === o.name), rest = ins.filter(i => i.name !== o.name);
        for (const i of [...same, ...rest]) {
          try {
            await i.open(); await o.open();
            const ok = await exchange(o, i, Uint8Array.from(ask), 1500).then(() => true, () => false);
            if (ok) { output = o; input = i; portsOpen = [i, o]; break search; }
          } catch (e) { /* port busy or gone: next */ }
          await Promise.allSettled([i.close()]);
        }
        await Promise.allSettled([o.close()]);
      }
      if (!output) { sendMsg('No MIDI port answered. Is the FM-1 connected over USB, running the SF2 player firmware (no other program using its port)? Ports tried: ' + outs.map(o => o.name).join(', ') + '.', true); return; }
      $('midiOut').value = output.id;
      const frames = uploadFrames(bin);
      for (const [i, frame] of frames.entries()) {
        const last = i === frames.length - 1;
        sendMsg(i === 0 ? 'Erasing the FM-1\'s flash (up to a minute) ...' : last ? 'Checking the bank ...' : 'Sending ' + Math.round(100 * i / frames.length) + ' %');
        let status = -1;
        // The waits are install.html's: the first frame erases the flash (up to a minute) and the last checks the whole bank (up to 30 s). The
        // answer comes when that is done, so a shorter wait reports a silent FM-1 that is only busy.
        for (let attempt = 0; attempt < 3 && status < 0; attempt++) {     // a lost frame is sent again: writing the same bytes twice is harmless
          try { status = await exchange(output, input, frame, i === 0 ? 90000 : last ? 30000 : 4000); } catch (e) { if (i === 0) break; }
        }
        if (status < 0) throw new Error(i === 0 ? 'The FM-1 did not answer when the flash was to be erased. Is it running the SF2 player firmware, and is "' + output.name + '" its port? Look at the UPLOAD line on the FM-1\'s screen.'
          : last ? 'The FM-1 did not answer the final check of the bank (frame ' + (i + 1) + ' of ' + frames.length + ').'
          : 'The FM-1 stopped answering at frame ' + (i + 1) + ' of ' + frames.length + '.');
        if (status !== 0) throw new Error('The FM-1 rejected frame ' + (i + 1) + ': ' + (SEND_ERRORS[status] || 'error ' + status) +
          (bank.packed && i === frames.length - 1 && status === 1 ? '. An MP3 bank plays only on the live-cache firmware.' : ''));
      }
      sendMsg('Done: ' + fmtBytes(bin.length) + ' is in the FM-1\'s flash and plays right away. It stays when the FM-1 is switched off.');
    } catch (e) {
      sendMsg(e.message || String(e), true);
    } finally {
      send.busy = false; $('sendFm1').disabled = false;
      if (portsOpen) await Promise.allSettled(portsOpen.map(p => p.close()));    // as install.html does: an open port blocks the next page that wants it
    }
  }
  $('sendFm1').addEventListener('click', sendBank);
  $('dlSf2').addEventListener('click', () => bank && download(writeSf2(bank, +$('preset').value < 0 || bank.presets.length > 1 ? baseName.slice(0, 19) : $('preset').selectedOptions[0].textContent.replace(/^.*?\s{2}/, '').slice(0, 19) || 'FM1'), baseName + '_fm1.sf2', 'audio/x-soundfont'));
})();
</script>
