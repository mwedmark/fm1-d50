# The D-50 on fm1-base (tools/build.py in a checkout of fm1-base with data_lo: FM1-BASE.md). Build:
#   python3 tools/build.py ../fm1-d50/fm1base --no-ble          (in the fm1-base checkout, beside this repository)
name = "D50"
id_prefix = "FM-1_50"
usb_manufacturer = "fm1-d50"
usb_product = "D-50 FM-1"
# the app area [0x4000, 0x5B000) and the data area from 0x5B000: the D-50's data (534 088 bytes, tools/d50_pack.js) at its start, up to
# 0xDD648; the panel's calibration in 0xDE000..0xDFFFF, the settings at 0xFC000 (app.h APP_STORE_MAP)
data_lo = 0x5B000
words = "words.tsv"
ble = false
cpu2 = true
cpu2_fallback = true
# the engine: C++ (third_party/picofaced5), one unit at -O2 with the C it needs (d50_unit.cpp); flags as fm1_open's sdk/Build.ps1 gives d50.cpp
o2 = ["d50_unit.cpp"]
o2_cflags = ["-std=c++1z", "-fno-exceptions", "-fno-rtti", "-fno-threadsafe-statics", "-nostdinc++", "-fno-unroll-loops", "-fno-vectorize",
             "-fno-slp-vectorize", "-DD5_REVERB_INT16", "-DD5_REVERB_EXTERNAL_POOL", "-DFM1_BASE=1"]
include = ["../fm1_open/app/d50", "../fm1_open/app/d50/cxx", "../third_party/picofaced5/include", "../roms/gen"]
device_include = ["inc"]
vendored = ["../third_party/"]
tagline = "the Roland D-50 on the FM-1 (PicoFaceD5)"
repo = "https://github.com/mwedmark/fm1-d50"
licence = "GPL-3.0-or-later"
author = "mwedmark"
description = "The PicoFaceD5 D-50 engine on fm1-base, with a flash layout that has room for the D-50's sample data."
tags = ["synth"]
